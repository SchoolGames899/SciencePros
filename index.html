<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Blocky Gladiators 3D - Single File</title>
    <!-- 1. External Script: Tailwind CSS -->

    <!-- 2. External Script: Babel Standalone (Compiles JSX/TS in browser) -->

    <style>
      body { margin: 0; overflow: hidden; background-color: #111; user-select: none; }
      #root { width: 100vw; height: 100vh; }
      canvas { display: block; }
      
      /* Animation Keyframes for Gacha */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      @keyframes zoomIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes flash {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>

    <!-- 3. Import Map Script: Defines module locations -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  </head>
  <body>
    <div id="root"></div>

    <!-- 4. Babel Script: Contains Types, Logic, and Rendering -->
    <script type="text/babel" data-type="module" data-presets="typescript,react">
      import React, { useEffect, useRef, useState } from 'react';
      import * as THREE from 'three';
      import ReactDOM from 'react-dom/client';

      // --- TYPES (Consolidated from types.ts) ---
      // Note: Interfaces are stripped by Babel at runtime, but helpful for development if using an IDE
      
      interface GameState {
        playerHp: number;
        enemyHp: number;
        gameOver: boolean;
        victory: boolean;
        score: number;
        winner: 'player' | 'enemy' | null;
        paused: boolean;
      }

      type ActionType = 'IDLE' | 'WALK' | 'ATTACK' | 'HIT';
      type Rarity = 'COMMON' | 'UNCOMMON' | 'RARE' | 'EPIC' | 'LEGENDARY';
      type HeroType = 'MELEE' | 'RANGED';

      interface HeroDef {
          id: string;
          name: string;
          type: HeroType;
          rarity: Rarity;
          baseHp: number;
          baseDmg: number;
          baseUltDmg: number;
          speed: number;
          color: number;
          description: string;
          ultimateName: string;
          ultimateDesc: string;
          sourceWorld: string;
          ultChargeMult?: number;
      }

      interface AbilityDef {
          id: string;
          name: string;
          rarity: Rarity;
          cooldown: number; 
          color: number;
          description: string;
          type: 'PROJECTILE' | 'BUFF' | 'AOE';
          sourceWorld: string;
      }

      interface WorldDef {
          id: string;
          name: string;
          unlockCost: number;
          waves: number;
          rewards: { type: 'HERO' | 'ABILITY' | 'FEATURE', id: string, name: string }[];
          color: number;
          skyColor: number;
          difficultyMod: number;
          description: string;
      }

      interface PlayerSave {
          gameSignature: string;
          gold: number;
          unlockedHeroes: { id: string; level: number }[];
          selectedHeroId: string;
          unlockedAbilities: string[]; 
          equippedAbilityId: string | null;
          equippedSecondaryAbilityId: string | null;
          unlockedFeatures: string[];
          unlockedWorlds: string[];
          completedWorlds: string[];
          selectedWorldId: string;
          skills: {
              vitality: number;
              strength: number;
              greed: number;
          };
      }

      // --- APP LOGIC (Consolidated from App.tsx) ---

      const GAME_SIGNATURE = "BLOCKY_GLADIATORS_3D_SECURE_V1";
      const ULTIMATE_MAX = 100;
      const ATTACK_COOLDOWN = 25; 
      const ARENA_SIZE = 40;
      const ABILITY_CRATE_COST = 300;
      const HERO_CRATE_COST = 500;
      const HERO_UPGRADE_BASE_COST = 200; 
      const MAX_HERO_LEVEL = 5;
      const GRAVITY = 0.05;
      const JUMP_FORCE = 0.8;
      const ENEMY_KNOCKBACK_UP = 0.4;
      const ENEMY_KNOCKBACK_FORCE = 0.8;

      const TUNNEL_OFFSET = 24; 

      const SPAWN_TUNNELS = [
          { x: 0, z: -TUNNEL_OFFSET, rot: 0 },          
          { x: 0, z: TUNNEL_OFFSET, rot: Math.PI },     
          { x: -TUNNEL_OFFSET, z: 0, rot: -Math.PI/2 }, 
          { x: TUNNEL_OFFSET, z: 0, rot: Math.PI/2 },   
      ];

      const OBSTACLES = [
        { x: 12, z: 12, size: 2.5 },
        { x: -12, z: 12, size: 2.5 },
        { x: 12, z: -12, size: 2.5 },
        { x: -12, z: -12, size: 2.5 },
      ];

      const TRAP_LOCATIONS = [
          { x: 0, z: 15 }, { x: 0, z: -15 }, { x: 15, z: 0 }, { x: -15, z: 0 },
          { x: 8, z: 8 }, { x: -8, z: -8 }, { x: 8, z: -8 }, { x: -8, z: 8 },
      ];

      const WORLDS = {
          'kingdom': { 
              id: 'kingdom', name: 'Kingdom of Valor', unlockCost: 0, waves: 5, color: 0x1a1a20, skyColor: 0x050510, difficultyMod: 1.0, description: 'The training grounds.',
              rewards: [{ type: 'HERO', id: 'ranger', name: 'Ranger' }]
          },
          'desert': { 
              id: 'desert', name: 'Dunes of Despair', unlockCost: 0, waves: 8, color: 0x7e4a35, skyColor: 0x4a2e20, difficultyMod: 1.5, description: 'Enemies are tougher here.',
              rewards: [{ type: 'FEATURE', id: 'secondary_slot', name: 'Secondary Ability Slot' }, { type: 'ABILITY', id: 'sandstorm', name: 'Sandstorm' }]
          },
          'tundra': { 
              id: 'tundra', name: 'Glacial Peaks', unlockCost: 0, waves: 10, color: 0x88aabb, skyColor: 0x102030, difficultyMod: 2.0, description: 'A cold, slippery hell.',
              rewards: [{ type: 'HERO', id: 'paladin', name: 'Paladin' }, { type: 'FEATURE', id: 'coin_magnet', name: 'Coin Magnet' }]
          },
          'void': { 
              id: 'void', name: 'Dimension X', unlockCost: 0, waves: 12, color: 0x110022, skyColor: 0x000000, difficultyMod: 3.0, description: 'Only despair awaits.',
              rewards: [{ type: 'ABILITY', id: 'void_hole', name: 'Black Hole' }, { type: 'FEATURE', id: 'vampirism', name: 'Vampirism (Heal on Kill)' }]
          }
      };

      const WORLD_ORDER = ['kingdom', 'desert', 'tundra', 'void'];

      const ABILITIES = {
          'fireball': { id: 'fireball', name: 'Fireball', rarity: 'COMMON', cooldown: 120, color: 0xff4400, description: 'Shoots a fiery projectile.', type: 'PROJECTILE', sourceWorld: 'kingdom' },
          'heal': { id: 'heal', name: 'Minor Heal', rarity: 'RARE', cooldown: 300, color: 0x00ff00, description: 'Heals 40 HP instantly.', type: 'BUFF', sourceWorld: 'kingdom' },
          'repel': { id: 'repel', name: 'Shockwave', rarity: 'EPIC', cooldown: 180, color: 0x0088ff, description: 'Pushes all nearby enemies away.', type: 'AOE', sourceWorld: 'kingdom' },
          'sandstorm': { id: 'sandstorm', name: 'Sandstorm', rarity: 'EPIC', cooldown: 400, color: 0xd2b48c, description: 'Summons a damaging sand vortex.', type: 'AOE', sourceWorld: 'desert' },
          'void_hole': { id: 'void_hole', name: 'Black Hole', rarity: 'LEGENDARY', cooldown: 600, color: 0xaa00aa, description: 'Sucks enemies into a singularity.', type: 'AOE', sourceWorld: 'void' }
      };

      const HEROES = {
          'knight': { id: 'knight', name: 'Knight', type: 'MELEE', rarity: 'COMMON', baseHp: 120, baseDmg: 15, baseUltDmg: 150, speed: 0.15, color: 0x3b82f6, description: 'Balanced warrior. Ult: Earth Slam.', ultimateName: 'Earth Slam', ultimateDesc: 'Massive AOE Jump Attack', sourceWorld: 'kingdom', ultChargeMult: 0.8 },
          'ranger': { id: 'ranger', name: 'Ranger', type: 'RANGED', rarity: 'COMMON', baseHp: 70, baseDmg: 18, baseUltDmg: 40, speed: 0.22, color: 0x22c55e, description: 'High speed sniper. Ult: Arrow Storm.', ultimateName: 'Arrow Storm', ultimateDesc: 'Fires arrows in all directions.', sourceWorld: 'kingdom', ultChargeMult: 1.5 },
          'berserker': { id: 'berserker', name: 'Berserker', type: 'MELEE', rarity: 'EPIC', baseHp: 140, baseDmg: 25, baseUltDmg: 200, speed: 0.16, color: 0xff0000, description: 'High damage, chaotic energy.', ultimateName: 'Rage Quake', ultimateDesc: 'Massive Damage Shockwave', sourceWorld: 'desert', ultChargeMult: 1.0 },
          'paladin': { id: 'paladin', name: 'Paladin', type: 'MELEE', rarity: 'LEGENDARY', baseHp: 180, baseDmg: 20, baseUltDmg: 100, speed: 0.14, color: 0xffd700, description: 'Tanky and resilient.', ultimateName: 'Holy Smite', ultimateDesc: 'Clear Enemies + Heal Self', sourceWorld: 'tundra', ultChargeMult: 0.9 },
      };

      const RARITY_COLORS = {
          'COMMON': '#9ca3af',
          'UNCOMMON': '#10b981', 
          'RARE': '#3b82f6',     
          'EPIC': '#a855f7',     
          'LEGENDARY': '#eab308' 
      };

      const RARITY_COST_MULT = {
          'COMMON': 1,
          'UNCOMMON': 1.5,
          'RARE': 2,
          'EPIC': 3,
          'LEGENDARY': 5
      };

      const SKILL_COST_BASE = 500;
      const SKILL_COST_MULT = 1.5;

      // --- Audio ---
      let globalAudioCtx = null;
      let noiseBuffer = null;

      const getAudioContext = () => {
          if (!globalAudioCtx) {
              globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const bufferSize = globalAudioCtx.sampleRate * 2;
              noiseBuffer = globalAudioCtx.createBuffer(1, bufferSize, globalAudioCtx.sampleRate);
              const data = noiseBuffer.getChannelData(0);
              for (let i = 0; i < bufferSize; i++) {
                  data[i] = Math.random() * 2 - 1;
              }
          }
          return globalAudioCtx;
      };

      const playSound = (type) => {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        const now = ctx.currentTime;

        const createNoise = (duration, filterFreq = 1000) => {
            if (!noiseBuffer) return;
            const src = ctx.createBufferSource();
            src.buffer = noiseBuffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(filterFreq, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + duration);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            src.start(now);
            src.stop(now + duration);
        };

        if (type === 'hit') {
            createNoise(0.2, 800);
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'crash') {
            createNoise(0.8, 400);
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'coin') {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.linearRampToValueAtTime(2000, now + 0.1);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now+0.1);
        } else if (type === 'warning') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.5);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'swing') {
            if (!noiseBuffer) return;
            const src = ctx.createBufferSource();
            src.buffer = noiseBuffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.Q.value = 1;
            filter.frequency.setValueAtTime(200, now);
            filter.frequency.linearRampToValueAtTime(1000, now + 0.15);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            src.start(now); src.stop(now + 0.25);
        } else if (type === 'shoot') {
            createNoise(0.3, 2000);
        } else if (type === 'jump') {
            const osc = ctx.createOscillator();
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(300, now + 0.2);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now+0.2);
        } else if (type === 'land') {
            createNoise(0.1, 400);
        } else if (type === 'ability') {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.5);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now); osc.stop(now+0.5);
        } else if (type === 'gacha') {
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(50, now);
            osc.frequency.linearRampToValueAtTime(800, now + 2.0);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 2.0);
            gain.gain.linearRampToValueAtTime(0, now + 2.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now+2.1);
        }
      };

      // --- Helpers ---
      function createFloatingText(text, color, position, scale = 1) {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');
          if (ctx) {
              ctx.font = 'Bold 100px Arial';
              ctx.fillStyle = color;
              ctx.textAlign = 'center';
              ctx.shadowColor = 'black';
              ctx.shadowBlur = 4;
              ctx.fillText(text, 256, 150);
          }
          const texture = new THREE.CanvasTexture(canvas);
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
          sprite.position.copy(position).add(new THREE.Vector3(0, 2.5, 0));
          sprite.scale.set(4 * scale, 2 * scale, 1);
          sprite.renderOrder = 999;
          return { mesh: sprite, life: 60, vel: new THREE.Vector3(0, 0.08, 0) };
      }

      function getHeroStats(heroId, currentSave) {
          const def = HEROES[heroId];
          const saved = currentSave.unlockedHeroes.find(h => h.id === heroId) || { level: 1 };
          const skillHp = currentSave.skills.vitality * 10;
          const skillDmg = currentSave.skills.strength * 2;
          
          const level = saved.level;
          const hp = def.baseHp + (level * 10) + skillHp;
          const dmg = def.baseDmg + (level * 2) + skillDmg;
          const ultDmg = Math.floor(def.baseUltDmg * (1 + (level - 1) * 0.2)); 
          
          const rarityMult = RARITY_COST_MULT[def.rarity];
          const upgradeCost = Math.floor(HERO_UPGRADE_BASE_COST * level * rarityMult);
          
          return { level, hp, dmg, ultDmg, upgradeCost, isMax: level >= MAX_HERO_LEVEL };
      }

      // --- Character Creator ---
      function createCharacter(color, type, isPlayer = false, scaleMod = 1) {
        const root = new THREE.Group();
        root.scale.set(scaleMod, scaleMod, scaleMod);

        const visual = new THREE.Group();
        root.add(visual);

        const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const emissiveMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.6), mat);
        body.position.y = 0.75;
        body.castShadow = true;
        visual.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
        head.position.y = 1.9;
        head.castShadow = true;
        visual.add(head);

        const eye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 0.1), darkMat);
        eye.position.set(0.2, 2.0, 0.4);
        visual.add(eye);
        const eye2 = eye.clone();
        eye2.position.set(-0.2, 2.0, 0.4);
        visual.add(eye2);

        if (type === 'TANK' || type === 'PALADIN') {
            const pad = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 0.6), darkMat);
            pad.position.set(0, 1.6, 0);
            visual.add(pad);
        } else if (type === 'SPEED' || type === 'BERSERKER') {
            const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.4), emissiveMat);
            fin.position.set(0, 2.4, -0.3);
            fin.rotation.x = -0.5;
            visual.add(fin);
        } else if (type === 'BOSS') {
            for(let i=0; i<5; i++) {
                const spike = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4, 4), emissiveMat);
                const angle = (i / 5) * Math.PI * 2;
                spike.position.set(Math.cos(angle)*0.3, 2.4, Math.sin(angle)*0.3);
                visual.add(spike);
            }
        } else if (type === 'RANGER') {
            const hood = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.9), new THREE.MeshStandardMaterial({color: 0x225522}));
            hood.position.y = 2.35;
            visual.add(hood);
        } else if (type === 'CRATE') {
            visual.remove(body); visual.remove(head); visual.remove(eye); visual.remove(eye2);
            const crateMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 }));
            crateMesh.position.y = 0.75;
            visual.add(crateMesh);
        }

        const rightArmPivot = new THREE.Group();
        rightArmPivot.position.set(0.6, 1.4, 0);
        visual.add(rightArmPivot);
        const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat);
        rightArm.position.y = -0.4;
        rightArmPivot.add(rightArm);

        const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat);
        leftArm.position.set(-0.6, 1.0, 0);
        visual.add(leftArm);

        let swordBlade = null;
        let bowMesh = null;

        if (type === 'RANGER') {
            const bowCurve = new THREE.TorusGeometry(0.6, 0.05, 8, 12, Math.PI);
            const bowMat = new THREE.MeshStandardMaterial({color: 0x8B4513});
            bowMesh = new THREE.Mesh(bowCurve, bowMat);
            bowMesh.position.set(0, -0.5, 0.4);
            bowMesh.rotation.z = -Math.PI/2;
            bowMesh.rotation.y = -Math.PI/2;
            rightArmPivot.add(bowMesh);
        } else if (type === 'MAGE') {
            const staff = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5), darkMat);
            staff.rotation.x = Math.PI / 2;
            staff.position.set(0, -1.0, 0.5);
            rightArmPivot.add(staff);
            const gem = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3), emissiveMat);
            gem.position.set(0, -1.0, 1.8);
            rightArmPivot.add(gem);
        } else if (type === 'EXPLODER') {
            const bomb = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({color: 0x000000}));
            bomb.position.set(0, -0.8, 0);
            rightArmPivot.add(bomb);
            const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.2), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            fuse.position.y = 0.5;
            bomb.add(fuse);
        } else if (type !== 'CRATE') {
            const swordGroup = new THREE.Group();
            const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6), darkMat);
            hilt.rotation.x = Math.PI/2;
            hilt.position.set(0, 0.2, 0);
            swordGroup.add(hilt);
            const guard = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.15), darkMat);
            guard.position.set(0, 0.5, 0);
            swordGroup.add(guard);
            const bladeMat = isPlayer ? emissiveMat : new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.8, 0.05), bladeMat);
            blade.position.set(0, 1.4, 0);
            const tip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.4, 4), bladeMat);
            tip.position.set(0, 2.3, 0);
            tip.rotation.y = Math.PI/4;
            swordGroup.add(blade);
            swordGroup.add(tip);
            swordGroup.rotation.x = 0; 
            swordGroup.rotation.y = Math.PI; 
            swordGroup.position.set(0, -0.6, 0.4);
            rightArmPivot.add(swordGroup);
            swordBlade = swordGroup;
        }

        if (isPlayer && type === 'PALADIN') {
            const shield = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.2), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
            shield.position.set(0, -0.4, 0.3);
            leftArm.add(shield);
        }

        let laserMesh = null;
        if (type === 'BOSS') {
            const lGeo = new THREE.CylinderGeometry(0.2, 0.2, 25, 8);
            lGeo.translate(0, 12.5, 0); lGeo.rotateX(Math.PI/2);
            laserMesh = new THREE.Mesh(lGeo, new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0 }));
            laserMesh.position.y = 1.5;
            visual.add(laserMesh);
        }

        root.userData.originalMaterials = [];
        visual.traverse((c) => {
            if (c.isMesh) {
                root.userData.originalMaterials.push({ mesh: c, color: c.material.color.clone(), emissive: c.material.emissive ? c.material.emissive.clone() : new THREE.Color(0,0,0) });
            }
        });

        return {
          mesh: root,
          visual: visual,
          rightArmPivot,
          leftArm,
          swordBlade,
          bowMesh,
          laserMesh,
          hp: 100, maxHp: 100,
          baseDmg: 10,
          heroType: 'MELEE',
          speed: 0.1,
          state: 'IDLE',
          attackTimer: 0,
          attackCooldown: 0,
          comboIndex: 0,
          comboTimer: 0,
          hitFlashTimer: 0,
          dashTimer: 0, dashCooldown: 0,
          spinCooldown: 0, slamCooldown: 0,
          parryWindow: 0,
          status: { burn: 0, freeze: 0 },
          lastPos: new THREE.Vector3(),
          velocity: new THREE.Vector3(), 
          type: type, 
          isPlayer: isPlayer,
          phase: 1, bossJumpCooldown: 180, bossLaserCooldown: 400, actionTimer: 0, jumpDir: new THREE.Vector3(), scale: scaleMod,
          color: color,
          spawnTimer: 0,
          spawnDir: new THREE.Vector3(),
          heroId: ''
        };
      }

      const App = () => {
        const mountRef = useRef(null);
        
        // Persistence
        const [saveData, setSaveData] = useState(() => {
            const saved = localStorage.getItem('blocky_save_v6');
            const defaultSave = { 
                gameSignature: GAME_SIGNATURE,
                gold: 0, 
                unlockedHeroes: [{id: 'knight', level: 1}], 
                selectedHeroId: 'knight',
                unlockedAbilities: ['fireball'], 
                equippedAbilityId: null,
                equippedSecondaryAbilityId: null,
                unlockedFeatures: [],
                unlockedWorlds: ['kingdom'],
                completedWorlds: [],
                selectedWorldId: 'kingdom',
                skills: { vitality: 0, strength: 0, greed: 0 }
            };
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.skills) parsed.skills = { vitality: 0, strength: 0, greed: 0 };
                    if (!Array.isArray(parsed.unlockedAbilities)) parsed.unlockedAbilities = ['fireball'];
                    if (parsed.unlockedAbilities.length === 0) parsed.unlockedAbilities = ['fireball'];
                    
                    if (parsed.gameSignature !== GAME_SIGNATURE) {
                        if (typeof parsed.gold === 'number' && Array.isArray(parsed.unlockedHeroes)) {
                            return { ...defaultSave, ...parsed, gameSignature: GAME_SIGNATURE };
                        }
                        return defaultSave;
                    }

                    return { ...defaultSave, ...parsed }; 
                } catch(e) {
                    console.error("Save corrupted", e);
                    return defaultSave;
                }
            }
            return defaultSave;
        });

        useEffect(() => {
            localStorage.setItem('blocky_save_v6', JSON.stringify(saveData));
        }, [saveData]);

        const [appMode, setAppMode] = useState('MENU');
        const [showRewards, setShowRewards] = useState(null);
        const [saveKeyInput, setSaveKeyInput] = useState("");
        
        const [gameState, setGameState] = useState({
          playerHp: 100, enemyHp: 100, gameOver: false, victory: false, score: 0, winner: null, wave: 1, streak: 0, powerup: null, element: 'NONE', boss: null, bossWarning: false, sessionCoins: 0, paused: false
        });
        
        const [gachaState, setGachaState] = useState('IDLE');
        const [gachaResult, setGachaResult] = useState(null);

        const [ultimateCharge, setUltimate] = useState(0);
        const [abilityCooldown, setAbilityCooldown] = useState(0);
        const [secondaryCooldown, setSecondaryCooldown] = useState(0);

        const gameRef = useRef({
          player: null,
          enemies: [],
          obstacles: [],
          environment: [],
          traps: [],
          projectiles: [],
          floatingTexts: [],
          pickups: [],
          decals: [],
          particles: [],
          keys: {},
          mouseRight: false,
          prevMouseRight: false,
          camera: null,
          scene: null,
          active: false,
          shake: 0,
          hitStop: 0,
          slowMoTimer: 0,
          score: 0,
          wave: 1,
          ultimateCharge: 0,
          abilityCooldown: 0,
          secondaryCooldown: 0,
          streak: 0,
          rageTimer: 0, 
          playerElement: 'NONE',
          bossPending: false, 
          bossSpawnTimer: 0,
          sessionCoins: 0,
          paused: false,
          isDead: false
        });

        const startGame = () => {
            gameRef.current.paused = false;
            gameRef.current.keys = {};
            gameRef.current.ultimateCharge = 0;
            setUltimate(0);
            setGameState(prev => ({...prev, paused: false}));
            setAppMode('GAME');
        };

        const handleSummon = (type) => {
            const cost = type === 'HERO' ? HERO_CRATE_COST : ABILITY_CRATE_COST;
            if (saveData.gold < cost) return;
            
            const newSave = { ...saveData, gold: saveData.gold - cost };
            setAppMode('GACHA');
            setGachaState('SHAKING');
            playSound('gacha'); 

            setTimeout(() => {
                setGachaState('OPENING');
                playSound('crash');
                setTimeout(() => {
                  const roll = Math.random();
                  let rarity = 'COMMON';
                  if (roll > 0.99) rarity = 'LEGENDARY';
                  else if (roll > 0.95) rarity = 'EPIC';
                  else if (roll > 0.80) rarity = 'RARE';
                  else if (roll > 0.50) rarity = 'UNCOMMON';

                  let resultMsg = "";
                  const allowedWorlds = saveData.unlockedWorlds;

                  if (type === 'HERO') {
                      let pool = Object.values(HEROES).filter(h => h.rarity === rarity && allowedWorlds.includes(h.sourceWorld));
                      if (pool.length === 0) pool = Object.values(HEROES).filter(h => allowedWorlds.includes(h.sourceWorld));

                      const unowned = pool.filter(h => !newSave.unlockedHeroes.find(uh => uh.id === h.id));
                      let hero;
                      if (unowned.length > 0) {
                          hero = unowned[Math.floor(Math.random() * unowned.length)];
                          newSave.unlockedHeroes.push({ id: hero.id, level: 1 });
                          resultMsg = `Unlocked Hero: ${hero.name}!`;
                      } else {
                          hero = pool[Math.floor(Math.random() * pool.length)];
                          resultMsg = `Duplicate ${hero.name}. Refunded 250 🪙`;
                          newSave.gold += 250;
                      }
                  } else {
                      let pool = Object.values(ABILITIES).filter(a => a.rarity === rarity && allowedWorlds.includes(a.sourceWorld));
                      if (pool.length === 0) pool = Object.values(ABILITIES).filter(a => allowedWorlds.includes(a.sourceWorld));

                      const unowned = pool.filter(a => !newSave.unlockedAbilities.includes(a.id));
                      let ability;
                      if (unowned.length > 0) {
                          ability = unowned[Math.floor(Math.random() * unowned.length)];
                          newSave.unlockedAbilities.push(ability.id);
                          resultMsg = `Unlocked Ability: ${ability.name}!`;
                      } else {
                          ability = pool[Math.floor(Math.random() * pool.length)];
                          resultMsg = `Duplicate ${ability.name} converted to 100 🪙`;
                          newSave.gold += 100;
                      }
                  }

                  setSaveData(newSave);
                  setGachaResult(resultMsg);
                  setGachaState('REVEALED');
                  playSound('ability');
                }, 500);
            }, 2000);
        };

        const handleUpgradeHero = () => {
            const stats = getHeroStats(saveData.selectedHeroId, saveData);
            if (stats.isMax) return;
            if (saveData.gold >= stats.upgradeCost) {
                const newHeroes = saveData.unlockedHeroes.map(h => {
                    if (h.id === saveData.selectedHeroId) return { ...h, level: h.level + 1 };
                    return h;
                });
                setSaveData({ ...saveData, gold: saveData.gold - stats.upgradeCost, unlockedHeroes: newHeroes });
                playSound('ability');
            }
        };

        const createParticleEffect = (pos, color, count = 8) => {
          const { scene, particles } = gameRef.current;
          if (!scene) return;
          for(let i=0; i<count; i++) {
              const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
              const mat = new THREE.MeshBasicMaterial({ color: color });
              const mesh = new THREE.Mesh(geo, mat);
              mesh.position.copy(pos);
              mesh.position.y += 1;
              mesh.position.x += (Math.random() - 0.5);
              mesh.position.z += (Math.random() - 0.5);
              scene.add(mesh);
              const vel = new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.3, (Math.random()-0.5)*0.3);
              particles.push({ mesh, vel, life: 30 + Math.random() * 20 });
          }
        };

        const createPickup = (pos, type) => {
            const { scene, pickups } = gameRef.current;
            let mesh;
            if (type === 'COIN') {
                const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.05, 12);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.rotation.x = Math.PI / 2;
                mesh.position.copy(pos);
                mesh.position.y = 0.5;
            } else if (type === 'HEAL') {
                mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5), new THREE.MeshBasicMaterial({color: 0x00ff00}));
                mesh.position.copy(pos);
                mesh.position.y = 1;
            } else {
                mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6), new THREE.MeshBasicMaterial({color: 0xffff00}));
                mesh.position.copy(pos);
                mesh.position.y = 1;
            }
            mesh.castShadow = true;
            scene.add(mesh);
            pickups.push({ mesh, type });
        };

        const createCoin = (pos) => createPickup(pos, 'COIN');

        const createShockwave = (pos, color = 0xffffff, size = 10) => {
            const { scene, particles, enemies, player } = gameRef.current;
            createParticleEffect(pos, color, 40);
            gameRef.current.shake = 1.5;
            
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.5, 32), new THREE.MeshBasicMaterial({color: color, transparent: true, side: THREE.DoubleSide}));
            ring.position.copy(pos); ring.position.y = 0.2; ring.rotation.x = -Math.PI/2;
            scene.add(ring);
            particles.push({ mesh: ring, life: 20, isShockwave: true, maxScale: size });

            if (player && player.mesh.position.distanceTo(pos) < size) {
                player.hp -= 30;
                player.hitFlashTimer = 10;
                player.velocity.y += 0.5;
                const push = player.mesh.position.clone().sub(pos).normalize().multiplyScalar(1.5);
                player.mesh.position.add(push);
                createFloatingText("30", "#ff0000", player.mesh.position);
            }
        };

        const resetGame = () => {
          const { scene } = gameRef.current;
          if (!scene) return;
          
          gameRef.current.keys = {};
          gameRef.current.paused = false;

          ['enemies', 'particles', 'projectiles', 'floatingTexts', 'pickups', 'decals', 'environment'].forEach(key => {
              gameRef.current[key].forEach((obj) => scene.remove(obj.mesh || obj));
              gameRef.current[key] = [];
          });
          
          const currentWorld = WORLDS[saveData.selectedWorldId];
          scene.background = new THREE.Color(currentWorld.skyColor);
          scene.fog = new THREE.Fog(currentWorld.skyColor, 20, 60);
          scene.children.forEach(c => {
              if (c.type === 'Mesh' && c.geometry.type === 'PlaneGeometry') {
                  c.material.color.setHex(currentWorld.color);
              }
          });

          const wallMat = new THREE.MeshStandardMaterial({color: 0x333333, roughness: 0.8});
          const pillarMat = new THREE.MeshStandardMaterial({color: 0x555555, roughness: 0.5});
          const offset = ARENA_SIZE/2 + 1;
          const segmentLen = (ARENA_SIZE / 2) - 4; 
          
          const createWallSegment = (x, z, w, d) => {
              const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 8, d), wallMat);
              mesh.position.set(x, 4, z);
              mesh.castShadow = true;
              scene.add(mesh);
              gameRef.current.environment.push(mesh);
          };

          createWallSegment(-segmentLen/2 - 4, -offset, segmentLen, 2);
          createWallSegment(segmentLen/2 + 4, -offset, segmentLen, 2);
          createWallSegment(-segmentLen/2 - 4, offset, segmentLen, 2);
          createWallSegment(segmentLen/2 + 4, offset, segmentLen, 2);
          createWallSegment(-offset, -segmentLen/2 - 4, 2, segmentLen);
          createWallSegment(-offset, segmentLen/2 + 4, 2, segmentLen);
          createWallSegment(offset, -segmentLen/2 - 4, 2, segmentLen);
          createWallSegment(offset, segmentLen/2 + 4, 2, segmentLen);

          const makePillar = (x, z) => {
              const mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 12, 4), pillarMat);
              mesh.position.set(x, 6, z);
              mesh.castShadow = true;
              scene.add(mesh);
              gameRef.current.environment.push(mesh);
              const torch = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 0.5), new THREE.MeshBasicMaterial({color: 0x8B4513}));
              torch.position.set(x, 8, z < 0 ? z + 2.2 : z - 2.2);
              scene.add(torch);
              gameRef.current.environment.push(torch);
              const flame = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xffaa00}));
              flame.position.set(x, 9.5, z < 0 ? z + 2.2 : z - 2.2);
              scene.add(flame);
              gameRef.current.environment.push(flame);
          };
          makePillar(offset, offset);
          makePillar(-offset, offset);
          makePillar(offset, -offset);
          makePillar(-offset, -offset);

          SPAWN_TUNNELS.forEach(t => {
              const tunnelGroup = new THREE.Group();
              const frame = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 4), new THREE.MeshStandardMaterial({color: 0x222222}));
              frame.position.y = 4;
              tunnelGroup.add(frame);
              const voidHole = new THREE.Mesh(new THREE.PlaneGeometry(5, 7), new THREE.MeshBasicMaterial({color: 0x000000}));
              voidHole.position.set(0, 3.5, 2.1); 
              tunnelGroup.add(voidHole);
              tunnelGroup.position.set(t.x, 0, t.z);
              tunnelGroup.rotation.y = t.rot;
              scene.add(tunnelGroup);
              gameRef.current.environment.push(tunnelGroup);
          });
          
          for(let i=0; i<8; i++) {
              const island = new THREE.Mesh(new THREE.ConeGeometry(20, 50, 4), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 1}));
              const angle = (i/8) * Math.PI * 2 + Math.random()*0.5;
              const dist = 80;
              island.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
              scene.add(island);
              gameRef.current.environment.push(island);
          }

          if (gameRef.current.player) scene.remove(gameRef.current.player.mesh);
          
          const stats = getHeroStats(saveData.selectedHeroId, saveData);
          const heroDef = HEROES[saveData.selectedHeroId];

          const player = createCharacter(heroDef.color, heroDef.id.toUpperCase(), true);
          player.maxHp = stats.hp;
          player.hp = stats.hp;
          player.baseDmg = stats.dmg; 
          player.speed = heroDef.speed;
          player.heroType = heroDef.type;
          player.velocity = new THREE.Vector3(0,0,0);
          player.heroId = heroDef.id; 

          scene.add(player.mesh);
          gameRef.current.player = player;

          gameRef.current.wave = 1;
          gameRef.current.score = 0;
          gameRef.current.active = true;
          gameRef.current.paused = false;
          gameRef.current.isDead = false;
          gameRef.current.ultimateCharge = 0;
          gameRef.current.abilityCooldown = 0;
          gameRef.current.secondaryCooldown = 0;
          gameRef.current.streak = 0;
          gameRef.current.rageTimer = 0;
          gameRef.current.bossPending = false;
          gameRef.current.sessionCoins = 0;
          
          setGameState({ playerHp: stats.hp, enemyHp: 100, gameOver: false, victory: false, score: 0, winner: null, wave: 1, streak: 0, powerup: null, element: 'NONE', boss: null, bossWarning: false, sessionCoins: 0, paused: false });
          setUltimate(0);
          setAbilityCooldown(0);
          setSecondaryCooldown(0);
          
          spawnWave(1);
        };

        const spawnWave = (waveNum) => {
          const world = WORLDS[saveData.selectedWorldId];
          const isFinalWave = waveNum === world.waves;
          const isBossWave = (waveNum % 5 === 0) || isFinalWave;

          if (isBossWave) {
              setGameState(prev => ({...prev, bossWarning: true}));
              playSound('warning');
              gameRef.current.bossPending = true;
              gameRef.current.bossSpawnTimer = 180; 
              return;
          }

          spawnEntities(waveNum, false);
          
          if (Math.random() > 0.7) { 
              for(let c=0; c < 2; c++) {
                  const pos = new THREE.Vector3((Math.random()-0.5)*30, 0, (Math.random()-0.5)*30);
                  createCoin(pos);
              }
          }
        };

        const spawnEntities = (waveNum, isBoss) => {
          const { scene, enemies } = gameRef.current;
          const world = WORLDS[saveData.selectedWorldId];
          const isFinalWave = waveNum === world.waves;
          const count = isBoss ? 1 : 3 + Math.ceil(waveNum * 1.5 * world.difficultyMod);

          if (Math.random() > 0.5 && !isBoss) {
              const crate = createCharacter(0xffd700, 'CRATE', false, 1);
              crate.hp = 30; crate.maxHp = 30;
              crate.mesh.position.set((Math.random()-0.5)*20, 0, (Math.random()-0.5)*20);
              scene.add(crate.mesh);
              enemies.push(crate);
          }

          for (let i = 0; i < count; i++) {
              let type = 'REGULAR';
              let color = 0xef4444; 
              let scale = 1;
              let hp = (100 + (waveNum * 10)) * world.difficultyMod;
              let speed = 0.08 * world.difficultyMod;
              let enemyDmg = 5 * world.difficultyMod;

              if (isBoss) {
                  type = 'BOSS'; 
                  color = isFinalWave ? 0x000000 : 0x9333ea; 
                  scale = isFinalWave ? 3.5 : 2.5; 
                  hp = (isFinalWave ? 1000 : 500) * world.difficultyMod; 
                  speed = 0.05; 
                  enemyDmg = 15 * world.difficultyMod; 
              } else if (waveNum > 1 && Math.random() > 0.7) {
                  type = 'TANK'; color = 0x16a34a; scale = 1.3; hp = 250 * world.difficultyMod; speed = 0.05; enemyDmg = 12 * world.difficultyMod;
              } else if (waveNum > 2 && Math.random() > 0.6) {
                  const r = Math.random();
                  if (r > 0.7) { type = 'SPEED'; color = 0xeab308; scale = 0.7; hp = 50 * world.difficultyMod; speed = 0.14; enemyDmg = 3 * world.difficultyMod; }
                  else if (r > 0.4) { type = 'MAGE'; color = 0x3b82f6; hp = 80 * world.difficultyMod; speed = 0.08; enemyDmg = 8 * world.difficultyMod; } 
                  else { type = 'EXPLODER'; color = 0xff6600; hp = 40 * world.difficultyMod; speed = 0.16; enemyDmg = 40 * world.difficultyMod; }
              }

              const enemy = createCharacter(color, type, false, scale);
              enemy.hp = hp; enemy.maxHp = hp; enemy.speed = speed;
              enemy.baseDmg = enemyDmg; 
              enemy.velocity = new THREE.Vector3();
              
              const tunnel = SPAWN_TUNNELS[Math.floor(Math.random() * SPAWN_TUNNELS.length)];
              const dir = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), tunnel.rot);
              enemy.mesh.position.set(tunnel.x, 0, tunnel.z).sub(dir.multiplyScalar(2)); 
              enemy.spawnTimer = 60; 
              enemy.spawnDir = dir; 

              scene.add(enemy.mesh);
              enemies.push(enemy);
          }
        }

        const clampPosition = (pos, radius = 0.5) => {
            const limit = ARENA_SIZE / 2 - radius;
            pos.x = Math.max(-limit, Math.min(limit, pos.x));
            pos.z = Math.max(-limit, Math.min(limit, pos.z));
            
            OBSTACLES.forEach(obs => {
                const obsPos = new THREE.Vector3(obs.x, 0, obs.z);
                const dist = new THREE.Vector3(pos.x, 0, pos.z).distanceTo(obsPos);
                const minDist = obs.size + radius;
                if (dist < minDist) {
                    const push = new THREE.Vector3(pos.x, 0, pos.z).sub(obsPos).normalize().multiplyScalar(minDist - dist);
                    pos.x += push.x;
                    pos.z += push.z;
                }
            });
        };

        const handleVictory = () => {
            const currentWorld = saveData.selectedWorldId;
            const currentIndex = WORLD_ORDER.indexOf(currentWorld);
            const nextWorld = WORLD_ORDER[currentIndex + 1];
            
            let newSave = { ...saveData };
            if (!newSave.completedWorlds.includes(currentWorld)) {
                newSave.completedWorlds.push(currentWorld);
            }
            
            let unlockMsg = "";
            if (nextWorld && !newSave.unlockedWorlds.includes(nextWorld)) {
                newSave.unlockedWorlds.push(nextWorld);
                unlockMsg = `Unlocked New World: ${WORLDS[nextWorld].name}!`;
            }
            
            const worldRewards = WORLDS[currentWorld].rewards;
            worldRewards.forEach(r => {
                if (r.type === 'HERO') {
                    if (!newSave.unlockedHeroes.find(h => h.id === r.id)) {
                        newSave.unlockedHeroes.push({ id: r.id, level: 1 });
                        unlockMsg += `\nUnlocked Hero: ${r.name}!`;
                    }
                } else if (r.type === 'ABILITY') {
                    if (!newSave.unlockedAbilities.includes(r.id)) {
                        newSave.unlockedAbilities.push(r.id);
                        unlockMsg += `\nUnlocked Ability: ${r.name}!`;
                    }
                } else if (r.type === 'FEATURE') {
                    if (!newSave.unlockedFeatures.includes(r.id)) {
                        newSave.unlockedFeatures.push(r.id);
                        unlockMsg += `\nUnlocked Feature: ${r.name}!`;
                    }
                }
            });
            
            const greedMult = 1 + (saveData.skills.greed * 0.1);
            const goldBonus = (1000 * (currentIndex + 1)) + (gameRef.current.sessionCoins * greedMult);
            newSave.gold += Math.floor(goldBonus);
            
            setSaveData(newSave);
            setGameState(p => ({ ...p, victory: true }));
        };

        const activateAbility = (slot) => {
            const abilityId = slot === 'PRIMARY' ? saveData.equippedAbilityId : saveData.equippedSecondaryAbilityId;
            if (!abilityId) return;
            
            const ability = ABILITIES[abilityId];
            if (slot === 'PRIMARY') gameRef.current.abilityCooldown = ability.cooldown;
            else gameRef.current.secondaryCooldown = ability.cooldown;
            
            const { player, enemies, projectiles, scene } = gameRef.current;
            playSound('ability');

            if (ability.id === 'fireball') {
                  const dir = new THREE.Vector3(0,0,1).applyQuaternion(player.mesh.quaternion);
                  const proj = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({color: ability.color}));
                  proj.position.copy(player.mesh.position).add(new THREE.Vector3(0, 1.5, 0)).add(dir.clone().multiplyScalar(1.5));
                  scene.add(proj);
                  projectiles.push({ mesh: proj, vel: dir.multiplyScalar(0.8), life: 60, isPlayer: true, dmg: 50 });
            } else if (ability.id === 'heal') {
                  player.hp = Math.min(player.maxHp, player.hp + 40);
                  createFloatingText("+40 HP", "#00ff00", player.mesh.position);
                  createParticleEffect(player.mesh.position, ability.color, 20);
            } else if (ability.id === 'repel') {
                  createParticleEffect(player.mesh.position, ability.color, 30);
                  gameRef.current.shake = 1.0;
                  enemies.forEach(e => {
                      const dist = e.mesh.position.distanceTo(player.mesh.position);
                      if (dist < 10) {
                          const pushDir = e.mesh.position.clone().sub(player.mesh.position).normalize();

                          particles.push({ mesh: trail, vel: new THREE.Vector3(), life: 10 });
                      }
                      if (p.mesh.position.x > ARENA_SIZE/2 || p.mesh.position.x < -ARENA_SIZE/2 || p.mesh.position.z > ARENA_SIZE/2 || p.mesh.position.z < -ARENA_SIZE/2) { hit = true; createParticleEffect(p.mesh.position, 0x888888, 5); }
                      if (!hit) environment.forEach(env => { if (!hit) { const box = new THREE.Box3().setFromObject(env); if (box.containsPoint(p.mesh.position)) { hit = true; createParticleEffect(p.mesh.position, 0x888888, 5); } } });
                      if (!hit) obstacles.forEach(obs => { if (!hit) { const dist = p.mesh.position.distanceTo(obs.position); if (dist < 3.0) { hit = true; createParticleEffect(p.mesh.position, 0x888888, 5); } } });

                      if (!hit) {
                          if (p.isPlayer) { 
                              for (const e of enemies) {
                                  if (e.hp > 0) { 
                                      const dx = e.mesh.position.x - p.mesh.position.x;
                                      const dz = e.mesh.position.z - p.mesh.position.z;
                                      const distSq = dx*dx + dz*dz;
                                      const dy = Math.abs((e.mesh.position.y + 1.0) - p.mesh.position.y);
                                      if (distSq < 6.25 && dy < 2.0) { 
                                          e.hp -= p.dmg; e.hitFlashTimer = 10; createFloatingText(Math.round(p.dmg).toString(), "#00ff00", e.mesh.position); createParticleEffect(e.mesh.position, 0x00ff00); hit = true; 
                                          
                                          const heroDef = HEROES[saveData.selectedHeroId];
                                          const ultMult = heroDef.ultChargeMult || 1.0;

                                          let ultGain = 2;
                                          if (e.type === 'BOSS') ultGain = 15;
                                          if (e.type === 'TANK') ultGain = 5;
                                          gameRef.current.ultimateCharge += (ultGain * ultMult);

                                          if (e.type === 'BOSS') {
                                              const roll = Math.random();
                                              if (roll > 0.6) createCoin(e.mesh.position); 
                                              else if (roll > 0.5) createPickup(e.mesh.position, 'HEAL');
                                          }
                                          break; 
                                      }
                                  }
                              }
                          } else { 
                              const dx = p.mesh.position.x - player.mesh.position.x;
                              const dz = p.mesh.position.z - player.mesh.position.z;
                              const distXZ = Math.sqrt(dx*dx + dz*dz);
                              const py = p.mesh.position.y;
                              
                              if (distXZ < 1.0 && py > 0 && py < 2.0) { 
                                  player.hp -= p.dmg; 
                                  player.hitFlashTimer = 10; 
                                  createFloatingText(Math.round(p.dmg).toString(), "#ff0000", player.mesh.position); 
                                  createParticleEffect(player.mesh.position, 0xff0000); 
                                  hit = true; 
                              } 
                          }
                      }
                      if (hit || p.life <= 0) { scene.remove(p.mesh); return false; } return true;
                  });
                  
                  gameRef.current.particles = particles.filter(p => { 
                      if (p.isShockwave) { p.mesh.scale.multiplyScalar(1.1); p.mesh.material.opacity -= 0.05; p.life--; if (p.life <= 0) { scene.remove(p.mesh); return false; } return true; }
                      p.mesh.position.add(p.vel.clone().multiplyScalar(dt)); p.vel.y -= 0.02 * dt; p.mesh.rotation.x += 0.1 * dt; p.life -= dt; if(p.life <= 0) { scene.remove(p.mesh); return false; } return true; 
                  });
                  gameRef.current.pickups = pickups.filter(p => { 
                      p.mesh.rotation.y += 0.05; 
                      if (p.type === 'COIN') { p.mesh.rotation.z += 0.05; if (saveData.unlockedFeatures.includes('coin_magnet')) { const dir = player.mesh.position.clone().sub(p.mesh.position).normalize(); p.mesh.position.add(dir.multiplyScalar(0.4 * dt)); } }
                      p.mesh.position.y = (p.type === 'COIN' ? 0.5 : 1) + Math.sin(time*5)*0.1;
                      if (p.mesh.position.distanceTo(player.mesh.position) < 2) { 
                          if (p.type === 'HEAL') { player.hp = Math.min(player.maxHp, player.hp + 30); createFloatingText("+30 HP", "#00ff00", player.mesh.position); playSound('heal'); } 
                          else if (p.type === 'ULT') { gameRef.current.ultimateCharge = 100; createFloatingText("ULT READY!", "#ffff00", player.mesh.position); playSound('ability'); } 
                          else if (p.type === 'COIN') { gameRef.current.sessionCoins += 10; createFloatingText("+10", "#ffd700", player.mesh.position, 0.5); playSound('coin'); }
                          scene.remove(p.mesh); return false; 
                      } return true; 
                  });

                  const targetCam = player.mesh.position.clone().add(new THREE.Vector3(0, 15, 13));
                  if (gameRef.current.shake > 0) { targetCam.x += (Math.random()-0.5)*gameRef.current.shake; targetCam.z += (Math.random()-0.5)*gameRef.current.shake; gameRef.current.shake *= 0.9; }
                  camera.position.lerp(targetCam, 0.1); camera.lookAt(player.mesh.position);

                  if (frameId % 5 === 0) { 
                      setGameState(prev => ({ ...prev, playerHp: player.hp, score: gameRef.current.score, wave: gameRef.current.wave, boss: currentBoss, sessionCoins: gameRef.current.sessionCoins })); 
                      setUltimate(gameRef.current.ultimateCharge); setAbilityCooldown(gameRef.current.abilityCooldown); setSecondaryCooldown(gameRef.current.secondaryCooldown);
                  }
              }

              renderer.render(scene, camera);
              frameId = requestAnimationFrame(animate);
          };

                          }} className="bg-blue-600 hover:bg-blue-500 p-4 rounded font-bold">EXPORT SAVE TO CLIPBOARD</button>
                          
                          <div className="flex gap-2">
                              <input 
                                  type="text" 
                                  value={saveKeyInput} 
                                  onChange={(e) => setSaveKeyInput(e.target.value)} 
                                  placeholder="Paste Save Code Here"
                                  className="flex-1 bg-slate-800 border border-slate-600 rounded p-2 text-white"
                              />
                              <button onClick={() => {
                                  try {
                                      const json = atob(saveKeyInput);
                                      const parsed = JSON.parse(json);
                                      
                                      let isValid = false;
                                      if (parsed && typeof parsed === 'object') {
                                          if (parsed.gameSignature === GAME_SIGNATURE) {
                                              isValid = true;
                                          } 
                                          else if (typeof parsed.gold === 'number' && 
                                                  Array.isArray(parsed.unlockedHeroes) && 
                                                  parsed.unlockedHeroes.some((h) => h.id === 'knight')) {
                                              parsed.gameSignature = GAME_SIGNATURE; 
                                              isValid = true;
                                          }
                                      }

                                      if (isValid) {
                                          setSaveData(parsed);
                                          alert("Save loaded successfully!");
                                          setAppMode('MENU');
                                      } else {
                                          alert("Invalid Save Data: This key belongs to a different game or is corrupted.");
                                      }
                                  } catch (e) {
                                      alert("Error loading save. Invalid format.");
                                  }
                              }} className="bg-green-600 hover:bg-green-500 px-4 rounded font-bold">IMPORT</button>
                          </div>
                          
                          <button onClick={() => {
                              if(confirm("Are you sure you want to wipe your save? This cannot be undone.")) {
                                  localStorage.removeItem('blocky_save_v6');
                                  window.location.reload();
                              }
                          }} className="bg-red-900/50 hover:bg-red-900 border border-red-500 p-4 rounded font-bold text-red-200 mt-8">RESET SAVE DATA</button>
                      </div>
                      <button onClick={() => setAppMode('MENU')} className="mt-8 text-slate-400 hover:text-white underline">Back</button>
                  </div>
              )}

              {/* --- WORLDS SELECT --- */}
              {appMode === 'WORLDS' && (
                  <div className="absolute inset-0 z-20 bg-slate-900 p-8 text-white flex flex-col">
                      <h1 className="text-4xl font-black mb-8 text-center text-yellow-500">CAMPAIGN MAP</h1>
                      <div className="flex-1 flex items-center gap-6 overflow-x-auto p-4">
                          {WORLD_ORDER.map((wid, idx) => {
                              const w = WORLDS[wid];
                              const unlocked = saveData.unlockedWorlds.includes(wid);
                              const completed = saveData.completedWorlds.includes(wid);
                              
                              return (
                                  <button 
                                      key={wid}
                                      onClick={() => { if(unlocked) { setSaveData({...saveData, selectedWorldId: wid}); setAppMode('MENU'); } }}
                                      className={`relative min-w-[300px] h-[400px] rounded-2xl border-4 p-6 flex flex-col justify-between transition-all ${saveData.selectedWorldId === wid ? 'border-yellow-400 shadow-[0_0_30px_rgba(250,204,21,0.3)] scale-105' : 'border-slate-700 hover:border-slate-500'} ${!unlocked ? 'opacity-50 grayscale cursor-not-allowed' : 'bg-slate-800'}`}
                                      style={{backgroundColor: unlocked ? 'transparent' : '#000'}}
                                  >
                                      <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80 rounded-xl"></div>
                                      <div className="relative z-10">
                                          <div className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">World {idx+1}</div>
                                          <h2 className="text-3xl font-black">{w.name}</h2>
                                          <div className="mt-2 text-slate-300 text-sm">{w.description}</div>
                                      </div>
                                      
                                      <div className="relative z-10">
                                          <div className="flex gap-2 mb-4">
                                              <div className="bg-black/50 px-3 py-1 rounded text-xs">Waves: {w.waves}</div>
                                              <div className="bg-black/50 px-3 py-1 rounded text-xs">Diff: {w.difficultyMod}x</div>
                                          </div>
                                          {completed && <div className="w-full bg-green-600/20 text-green-400 font-bold text-center py-2 rounded mb-2">COMPLETED</div>}
                                          {!unlocked && <div className="w-full bg-red-900/50 text-red-400 font-bold text-center py-2 rounded">LOCKED</div>}
                                          {unlocked && saveData.selectedWorldId !== wid && <div className="w-full bg-slate-700 text-white font-bold text-center py-2 rounded hover:bg-white hover:text-black">SELECT</div>}
                                          {saveData.selectedWorldId === wid && <div className="w-full bg-yellow-500 text-black font-bold text-center py-2 rounded">SELECTED</div>}
                                      </div>
                                  </button>
                              );
                          })}
                      </div>
                      <button onClick={() => setAppMode('MENU')} className="self-center mt-8 px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-full">BACK</button>
                  </div>
              )}

              {/* --- ABILITIES SELECT --- */}
              {appMode === 'ABILITIES' && (
                  <div className="absolute inset-0 z-20 bg-slate-900 p-8 text-white flex flex-col">
                      <div className="flex justify-between items-center mb-6 px-4">
                          <h1 className="text-4xl font-black text-blue-400">SPELLBOOK</h1>
                          <div className="flex items-center gap-4">
                              <div className="bg-slate-800 px-4 py-2 rounded-full border border-yellow-500/50 flex items-center gap-2 text-white">
                                  <span className="text-yellow-400 text-xl">🪙</span>
                                  <span className="text-xl font-bold">{saveData.gold}</span>
                              </div>
                              <button 
                                  onClick={() => handleSummon('ABILITY')} 
                                  disabled={saveData.gold < ABILITY_CRATE_COST}
                                  className="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-full font-bold shadow-lg disabled:opacity-50 disabled:grayscale transition-all hover:scale-105"
                              >
                                  SUMMON NEW (🪙{ABILITY_CRATE_COST})
                              </button>
                          </div>
                      </div>
                      <div className="flex-1 overflow-y-auto grid grid-cols-3 gap-4 p-4">
                          {Object.values(ABILITIES).map(ab => {
                              const unlocked = saveData.unlockedAbilities.includes(ab.id);
                              const isPrimary = saveData.equippedAbilityId === ab.id;
                              const isSecondary = saveData.equippedSecondaryAbilityId === ab.id;
                              const hasSecondarySlot = saveData.unlockedFeatures.includes('secondary_slot');
                              
                              const worldName = WORLDS[ab.sourceWorld]?.name || "Unknown World";
                              const isWorldUnlocked = saveData.unlockedWorlds.includes(ab.sourceWorld);

                              if (!unlocked) {
                                  return (
                                      <div key={ab.id} className="bg-slate-800/40 p-6 rounded-xl border border-slate-700 flex flex-col justify-between opacity-70 relative overflow-hidden group">
                                          {/* Lock Overlay */}
                                          <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-10 backdrop-blur-[1px] group-hover:backdrop-blur-none transition-all">
                                              <div className="text-4xl mb-2">🔒</div>
                                              <div className="font-bold text-slate-300">LOCKED</div>
                                              <div className="text-xs text-slate-500 mt-1">Found in: {isWorldUnlocked ? worldName : '???'}</div>
                                          </div>

                                          {/* Preview Content */}
                                          <div className="blur-[2px] group-hover:blur-0 transition-all duration-300">
                                              <div className="flex justify-between items-start mb-2">
                                                  <h3 className="text-xl font-bold text-slate-400">{ab.name}</h3>
                                                  <span className="text-[10px] px-2 py-1 rounded bg-black/50 text-slate-500">{ab.rarity}</span>
                                              </div>
                                              <p className="text-slate-500 text-sm mb-4">{ab.description}</p>
                                              <div className="text-xs text-slate-600 font-mono">CD: {ab.cooldown/60}s • {ab.type}</div>
                                          </div>
                                          
                                          <div className="mt-4 py-2 bg-slate-800 text-slate-600 text-center text-sm font-bold rounded cursor-not-allowed">
                                              LOCKED
                                          </div>
                                      </div>
                                  );
                              }

                              return (
                                  <div key={ab.id} className={`bg-slate-800 p-6 rounded-xl border-2 flex flex-col justify-between transition-all hover:scale-[1.02] ${isPrimary ? 'border-purple-500 bg-purple-900/20 shadow-[0_0_15px_rgba(168,85,247,0.3)]' : (isSecondary ? 'border-orange-500 bg-orange-900/20 shadow-[0_0_15px_rgba(249,115,22,0.3)]' : 'border-slate-700 hover:border-slate-500')}`}>
                                      <div>
                                          <div className="flex justify-between items-start mb-2">
                                              <h3 className="text-xl font-bold">{ab.name}</h3>
                                              <span className="text-[10px] px-2 py-1 rounded bg-black/50" style={{color: RARITY_COLORS[ab.rarity]}}>{ab.rarity}</span>
                                          </div>
                                          <p className="text-slate-400 text-sm mb-4">{ab.description}</p>
                                          <div className="text-xs text-slate-500 font-mono">CD: {ab.cooldown/60}s • {ab.type}</div>
                                      </div>
                                      <div className="flex gap-2 mt-4">
                                          <button 
                                              onClick={() => {
                                                  if (isPrimary) setSaveData({...saveData, equippedAbilityId: null});
                                                  else {
                                                      if (saveData.equippedSecondaryAbilityId === ab.id) setSaveData({...saveData, equippedSecondaryAbilityId: null, equippedAbilityId: ab.id});
                                                      else setSaveData({...saveData, equippedAbilityId: ab.id});
                                                  }
                                              }}
                                              className={`flex-1 py-2 rounded font-bold text-sm transition-colors ${isPrimary ? 'bg-purple-600 hover:bg-purple-500 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}
                                          >
                                              {isPrimary ? 'UNEQUIP' : 'PRIMARY'}
                                          </button>
                                          {hasSecondarySlot && (
                                              <button 
                                                  onClick={() => {
                                                      if (isSecondary) setSaveData({...saveData, equippedSecondaryAbilityId: null});
                                                      else {
                                                          if (saveData.equippedAbilityId === ab.id) setSaveData({...saveData, equippedAbilityId: null, equippedSecondaryAbilityId: ab.id});
                                                          else setSaveData({...saveData, equippedSecondaryAbilityId: ab.id});
                                                      }
                                                  }}
                                                  className={`flex-1 py-2 rounded font-bold text-sm transition-colors ${isSecondary ? 'bg-orange-600 hover:bg-orange-500 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}
                                              >
                                                  {isSecondary ? 'UNEQUIP' : 'SECONDARY'}
                                              </button>
                                          )}
                                      </div>
                                  </div>
                              );
                          })}
                      </div>
                      <button onClick={() => setAppMode('MENU')} className="self-center mt-8 px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-full">BACK TO MENU</button>
                  </div>
              )}

          </div>
        );
      };

      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
